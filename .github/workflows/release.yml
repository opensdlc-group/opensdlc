name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: version
        name: Read the version and its changelog entry
        run: |
          version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          awk -v heading="## $version " 'index($0, heading) == 1 {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no entry for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package the source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          git archive --format=tar.gz --prefix="opensdlc-$VERSION/" -o "$RUNNER_TEMP/dist/opensdlc-$VERSION.tar.gz" HEAD
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the archive with Sigstore
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/dist/opensdlc-$VERSION.tar.gz"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/opensdlc-*.tar.gz
      - name: Draft the release with the archive and its signature
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "OpenSDLC $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/dist/opensdlc-$VERSION.tar.gz" "$RUNNER_TEMP/dist/opensdlc-$VERSION.tar.gz.sigstore.json"
