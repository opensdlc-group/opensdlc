name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/ci/python/lint.txt
      - run: ruff check --select E9,F --target-version py312 .
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: plugin/template/.opensdlc/cli

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix .github/ci/claude-code
      - name: The marketplace and the plugin validate
        run: |
          claude=.github/ci/claude-code/node_modules/.bin/claude
          "$claude" plugin validate .
          "$claude" plugin validate ./plugin

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint the template's workflows as an adopting repository sees them
        run: |
          lint="$RUNNER_TEMP/template"
          mkdir -p "$lint"
          cp -R plugin/template/.github "$lint/"
          cd "$lint"
          git init -q
          "$(go env GOPATH)/bin/actionlint"

  bench-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: |
          pip install --require-hashes -r .github/ci/python/bench.txt
          python -m playwright install --with-deps chromium
      - name: Every target's reference passes CI and every acceptance check
        run: python bench verify
