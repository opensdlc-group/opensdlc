version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /plugin/template
      - /plugin/template/.github/actions/opensdlc-apply
      - /plugin/template/.github/actions/opensdlc-plugin
      - /plugin/template/.github/actions/opensdlc-sandbox
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /bench/scenarios/*/targets/*/skeleton
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
