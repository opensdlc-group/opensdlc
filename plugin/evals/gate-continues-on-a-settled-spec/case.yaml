schema_version: '1.1'
name: gate-continues-on-a-settled-spec
description: A draft spec whose concerns are all resolved or carried with an owner. The gate has no reason to escalate.
tags:
- gate
context:
  scaffold_script: fixture.sh
execution:
  model: sonnet
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: /opensdlc:gate changes/2026-10-due-dates spec (headless)
graders:
- name: continues
  type: regex
  pattern: '"verdict"\s*:\s*"continue"'
  target:
    source: file
    path: .opensdlc/out/gate.json
