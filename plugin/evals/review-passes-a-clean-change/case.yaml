schema_version: '1.1'
name: review-passes-a-clean-change
description: A green pull request that implements an accepted plan for clearing finished todos and adds its own tests. The review raises nothing Important.
tags:
- review
context:
  scaffold_script: fixture.sh
execution:
  model: sonnet
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: /opensdlc:review .opensdlc/out/pr.diff (headless)
graders:
- name: wrote-the-tally
  type: file_exists
  path: .opensdlc/out/review.json
- name: raises-nothing-important
  type: regex
  match: not_contains
  pattern: '"severity"\s*:\s*"important"'
  target:
    source: file
    path: .opensdlc/out/review.json
