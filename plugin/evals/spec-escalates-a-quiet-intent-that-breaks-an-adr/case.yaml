schema_version: '1.1'
name: spec-escalates-a-quiet-intent-that-breaks-an-adr
description: Intake missed the conflict and the product owner accepted an intent to reuse deleted ids that never mentions ADR 0001. The spec has to find the ADR itself and escalate.
tags:
- spec
context:
  scaffold_script: fixture.sh
execution:
  model: sonnet
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: /opensdlc:spec changes/2026-10-small-todo-numbers (write, headless)
graders:
- name: escalated
  type: file_exists
  path: .opensdlc/out/escalate.md
- name: names-the-adr
  type: regex
  pattern: 0001|permanent|never (be )?reused
  flags: i
  target:
    source: file
    path: .opensdlc/out/escalate.md
