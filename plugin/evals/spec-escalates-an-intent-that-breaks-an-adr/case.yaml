schema_version: '1.1'
name: spec-escalates-an-intent-that-breaks-an-adr
description: The product owner accepted an intent to reuse deleted ids without noticing ADR 0001. The spec must escalate instead of designing the reversal.
tags:
- spec
context:
  scaffold_script: fixture.sh
execution:
  model: sonnet
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: /opensdlc:spec changes/2026-10-keep-todo-numbers-small (write, headless)
graders:
- name: escalated
  type: file_exists
  path: .opensdlc/out/escalate.md
- name: names-the-adr
  type: regex
  pattern: 0001|permanent|never (be )?reused
  flags: i
  target:
    source: file
    path: .opensdlc/out/escalate.md
