schema_version: '1.1'
name: intent-escalates-a-ticket-that-breaks-an-adr
description: Intake gets a reasonable-sounding request to reuse deleted ids, which ADR 0001 rules out. Only the product owner can reverse the ADR, so intake must escalate.
tags:
- intent
context:
  scaffold_script: fixture.sh
execution:
  model: sonnet
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: /opensdlc:intent --ticket .opensdlc/out/ticket.md
graders:
- name: escalated
  type: file_exists
  path: .opensdlc/out/escalate.md
- name: names-the-adr
  type: regex
  pattern: 0001|permanent|never (be )?reused
  flags: i
  target:
    source: file
    path: .opensdlc/out/escalate.md
