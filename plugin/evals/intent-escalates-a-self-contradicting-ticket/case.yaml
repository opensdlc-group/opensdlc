schema_version: '1.1'
name: intent-escalates-a-self-contradicting-ticket
description: Intake gets a ticket that contradicts itself and ticket 1. Only the product owner can settle it, so intake must escalate.
tags:
- intent
context:
  scaffold_script: fixture.sh
execution:
  model: sonnet
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  prompt: /opensdlc:intent --ticket .opensdlc/out/ticket.md
graders:
- name: escalated
  type: file_exists
  path: .opensdlc/out/escalate.md
- name: names-the-contradiction
  type: regex
  pattern: done|finished|complet
  flags: i
  target:
    source: file
    path: .opensdlc/out/escalate.md
