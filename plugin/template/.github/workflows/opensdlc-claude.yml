name: OpenSDLC @claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions: {}
jobs:
  claude:
    if: >-
      (contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: ./.github/actions/opensdlc-sandbox
      - id: plugin
        uses: ./.github/actions/opensdlc-plugin
        with:
          token: ${{ secrets.OPENSDLC_PLUGIN_TOKEN }}
      - uses: ./.github/actions/opensdlc-agent
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin: ${{ steps.plugin.outputs.dir }}
          max-turns: 60
