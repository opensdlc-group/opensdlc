name: OpenSDLC @claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions: {}
jobs:
  claude:
    if: >-
      (contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: ./.github/actions/opensdlc-sandbox
      - id: plugin
        uses: ./.github/actions/opensdlc-plugin
        with:
          token: ${{ secrets.OPENSDLC_PLUGIN_TOKEN }}
      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: .opensdlc/ci-settings.json
          claude_args: >-
            --plugin-dir "${{ steps.plugin.outputs.dir }}"
            --max-turns 60
