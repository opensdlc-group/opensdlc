name: OpenSDLC security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@7cdc7ef878439f74842c00422c65ab864ed83125 # v3.93.5
        with:
          extra_args: --results=verified,unknown

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - name: Known vulnerabilities in dependencies
        run: |
          set +e
          "$(go env GOPATH)/bin/osv-scanner" scan source --recursive .
          code=$?
          set -e
          if [ "$code" -eq 128 ]; then
            echo "No dependency manifests or lockfiles to scan."
            exit 0
          fi
          exit "$code"

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.163.0
      - name: Static analysis, new findings only on pull requests
        run: |
          baseline=()
          if [ -n "$BASE" ]; then baseline=(--baseline-commit "$BASE"); fi
          semgrep scan --config p/default --metrics off --error "${baseline[@]}"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
