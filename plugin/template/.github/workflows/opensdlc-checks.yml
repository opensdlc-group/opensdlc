name: OpenSDLC checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: opensdlc-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Judge with the base branch's OpenSDLC
        run: |
          rm -rf .opensdlc
          git checkout "$BASE" -- .opensdlc
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -P -m opensdlc check
        env:
          PYTHONPATH: .opensdlc/cli

  plan-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Judge with the base branch's OpenSDLC
        run: |
          rm -rf .opensdlc
          git checkout "$BASE" -- .opensdlc
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Changed files match the plan
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.md"
          python -P -m opensdlc plan-match --base "$BASE" --head HEAD --body-file "$RUNNER_TEMP/body.md"
        env:
          PYTHONPATH: .opensdlc/cli
          BASE: ${{ github.event.pull_request.base.sha }}
          BODY: ${{ github.event.pull_request.body }}
