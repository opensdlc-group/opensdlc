name: OpenSDLC review tuning
on:
  schedule:
    - cron: "29 1 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -P -m opensdlc review-tuning --days 30
        env:
          PYTHONPATH: .opensdlc/cli
          GH_TOKEN: ${{ github.token }}
      - name: Open this month's tuning issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create opensdlc-review-tuning --repo "$GITHUB_REPOSITORY" --color 5319E7 --description "Monthly OpenSDLC review tuning" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --title "OpenSDLC review tuning, $(date -u +%Y-%m)" --label opensdlc-review-tuning --body-file .opensdlc/out/review-tuning.md
