name: OpenSDLC intake
on:
  issues:
    types: [labeled]
permissions:
  contents: read
jobs:
  agent:
    if: github.event.label.name == 'intent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/opensdlc-sandbox
      - name: Hand the ticket over as a file
        env:
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          CREATED: ${{ github.event.issue.created_at }}
          URL: ${{ github.event.issue.html_url }}
        run: |
          mkdir -p .opensdlc/out
          {
            printf '# Ticket #%s: %s\n\n' "$NUMBER" "$TITLE"
            printf 'Reporter: %s · Opened: %s · %s\n\n' "$AUTHOR" "$CREATED" "$URL"
            printf '%s\n' "$BODY"
          } > .opensdlc/out/ticket.md
      - name: Keep a pristine git directory
        run: cp -a .git "$RUNNER_TEMP/pristine.git"
      - id: plugin
        uses: ./.github/actions/opensdlc-plugin
        with:
          token: ${{ secrets.OPENSDLC_PLUGIN_TOKEN }}
      - uses: ./.github/actions/opensdlc-agent
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          prompt: /opensdlc:intent --ticket .opensdlc/out/ticket.md
          plugin: ${{ steps.plugin.outputs.dir }}
          max-turns: 30
          allowed-tools: "Read,Glob,Grep,Skill,Edit(changes/**),Edit(.opensdlc/out/escalate.md)"
          tools: "Read,Glob,Grep,Skill,Edit,Write"
      - name: Capture the agent's work
        env:
          GIT_DIR: ${{ runner.temp }}/pristine.git
          GIT_WORK_TREE: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent-out"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/agent-out/opensdlc.patch"
          if [ -f .opensdlc/out/escalate.md ] && [ ! -L .opensdlc/out/escalate.md ]; then
            cp .opensdlc/out/escalate.md "$RUNNER_TEMP/agent-out/"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opensdlc-intake-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/agent-out/
          retention-days: 7

  propose:
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: apply
        uses: ./.github/actions/opensdlc-apply
        with:
          name: opensdlc-intake-${{ github.event.issue.number }}
          change: new
          allow: changes/**
      - id: intent
        name: Find the drafted intent
        run: |
          path=$(git diff --cached --name-only | grep -E '^changes/[a-z0-9][a-z0-9-]*/intent\.md$' | head -n 1)
          if [ -z "$path" ]; then
            echo "::error::The agent drafted no intent."
            exit 1
          fi
          echo "change=$(basename "$(dirname "$path")")" >> "$GITHUB_OUTPUT"
      - name: Propose acceptance unless the agent escalated
        if: steps.apply.outputs.escalated != 'true'
        run: python -P -m opensdlc accept "$CHANGE" --kind intent
        env:
          PYTHONPATH: .opensdlc/cli
          CHANGE: ${{ steps.intent.outputs.change }}
      - id: reviewers
        run: python -P -m opensdlc reviewers "$CHANGE" --kind intent
        env:
          PYTHONPATH: .opensdlc/cli
          CHANGE: ${{ steps.intent.outputs.change }}
      - id: pin
        name: Read the plugin version the agents ran
        run: python -P -m opensdlc plugin
        env:
          PYTHONPATH: .opensdlc/cli
      - name: Describe the pull request
        env:
          PIN: ${{ steps.pin.outputs.pin }}
          CHANGE: ${{ steps.intent.outputs.change }}
          NUMBER: ${{ github.event.issue.number }}
          ESCALATED: ${{ steps.apply.outputs.escalated }}
        run: |
          {
            echo "Intent drafted from #$NUMBER."
            echo
            if [ "$ESCALATED" = true ]; then
              echo "The ticket left too much unclear to propose acceptance. Answer the open questions on this branch, then run \`python3 -m opensdlc accept $CHANGE --kind intent\`."
              echo
              cat .opensdlc/out/escalate.md
            else
              echo "This PR proposes \`status: accepted\`. Merging it with a product owner's approval accepts the intent and starts the spec."
            fi
            echo
            echo "Written with OpenSDLC \`$PIN\`."
            echo
            echo "Change: $CHANGE"
            echo "Refs #$NUMBER"
          } > "$RUNNER_TEMP/body.md"
      - id: bot
        if: vars.OPENSDLC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OPENSDLC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENSDLC_APP_PRIVATE_KEY }}
      - id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.bot.outputs.token || secrets.OPENSDLC_PR_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: opensdlc/intake/${{ github.event.issue.number }}
          title: "Intent: ${{ github.event.issue.title }}"
          commit-message: |
            Intent from #${{ github.event.issue.number }}

            OpenSDLC-Plugin: ${{ steps.pin.outputs.pin }}
          body-path: ${{ runner.temp }}/body.md
          labels: ${{ steps.apply.outputs.escalated == 'true' && 'opensdlc,needs-human' || 'opensdlc' }}
          reviewers: ${{ steps.reviewers.outputs.users }}
          team-reviewers: ${{ steps.reviewers.outputs.teams }}
      - name: Link the ticket to its intent
        if: steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          URL: ${{ steps.pr.outputs.pull-request-url }}
        run: gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Drafted as an intent in $URL."
