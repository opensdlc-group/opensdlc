name: OpenSDLC plugin
description: Check out the OpenSDLC plugin at the repository and ref .opensdlc/config.json pins, outside the workspace
inputs:
  token:
    description: A token that can read the plugin repository, when it is private
    required: false
outputs:
  dir:
    description: The plugin directory, for claude --plugin-dir
    value: ${{ steps.place.outputs.dir }}
  pin:
    description: The pinned repository and ref, as owner/name@ref
    value: ${{ steps.pin.outputs.pin }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        PYTHONPATH: .opensdlc/cli
      run: python3 -P -m opensdlc plugin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pin.outputs.repository }}
        ref: ${{ steps.pin.outputs.ref }}
        token: ${{ inputs.token || github.token }}
        path: .opensdlc-plugin-checkout
        persist-credentials: false
    - id: place
      shell: bash
      run: |
        mv .opensdlc-plugin-checkout "$RUNNER_TEMP/opensdlc-plugin"
        echo "dir=$RUNNER_TEMP/opensdlc-plugin/plugin" >> "$GITHUB_OUTPUT"
